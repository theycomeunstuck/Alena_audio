[project]
name = "TeachCopilot_RAG"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.10",
    "numpy>=2.2.6",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "striprtf>=0.0.32",
    "tiktoken>=0.12.0",
    "torch>=2.2,<3",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "graphiti-core>=0.31.2",
    "ipykernel>=7.2.0",
    "langgraph-cli[inmem]>=0.4.25",
    "mem0ai==2.2.1",
    "playwright>=1.65.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# Only collect real tests under tests/. Without this, plain `pytest` also collects
# scripts/test_pipeline.py, whose body runs a full live DB + embedding-model +
# LM Studio integration at import time and crashes on a DB-less/GPU-less machine.
testpaths = ["tests"]
markers = [
    "live: end-to-end checks against the real local Ollama runtime and a disposable PostgreSQL database (deselected by default)",
    "postgres: needs the local disposable PostgreSQL server; skips cleanly when it is unreachable",
]
