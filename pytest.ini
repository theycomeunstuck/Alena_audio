# pytest.ini
[pytest]
markers =
    deep: реальные, долгие интеграционные тесты с моделями
addopts = -m "not deep"
# Audit F-045: without testpaths, plain `pytest` from the repo root recursed
# into TeachCopilot_RAG and collected scripts/test_pipeline.py, whose module
# body writes to the configured PostgreSQL. Audio tests live in tests/.
testpaths = tests

filterwarnings =
    ignore:FP16 is not supported on CPU; using FP32 instead:UserWarning:whisper\.
    ignore:Module 'speechbrain\.pretrained' was deprecated.*:UserWarning